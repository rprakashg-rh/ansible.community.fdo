- name: Install Packages
  ansible.builtin.dnf:
    state: present
    name:
      - fdo-admin-cli
      - firewalld
      - sshpass
      - rsync
      - podman

- name: Start podman service
  ansible.builtin.systemd:
    name: podman
    state: started
    enabled: true

- name: Creates FDO Keys Directory
  ansible.builtin.file:
    path: "{{ fdo_src }}/keys"
    state: directory
    mode: "0775"
  when: not generate_keys_and_certificates | bool

- name: Create Manufacturer Service Keys Stores
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0775"
    recurse: true
  loop:
    - "{{ fdo_src }}/stores/manufacturer_keys"
    - "{{ fdo_src }}/stores/manufacturing_sessions"
    - "{{ fdo_src }}/stores/owner_vouchers"
    - "{{ fdo_src }}/manufacturing-server.conf.d"

- name: Generate FDO keys and certificates
  ansible.builtin.import_role:
    name: generate_keys_and_certificates
  vars:
    generated_certs_dir: "{{ fdo_src }}/keys"
  when: generate_keys_and_certificates | bool

- name: Create Manufacturing Server Config file
  ansible.builtin.template:
    src: manufacturing-server.yml.j2
    dest: "{{ fdo_src }}/manufacturing-server.conf.d/manufacturing-server.yml"
    mode: "0644"

- name: Deploy manufacturing server as container
  when:
  - not rpm | bool
  block:
  - name: Setup registry auth
    ansible.builtin.import_role: 
      name: setup_registry_auth
    vars:
      rh_offline_token: "{{ offline_token }}"
      
  - name: Podman login
    containers.podman.podman_login:
      authfile: /etc/containers/auth.json
      registry: registry.redhat.io
  
  - name: Pull container_image
    containers.podman.podman_image:
      name: registry.redhat.io/rhel9/fdo-manufacturing-server:latest
      state: present
      auth_file: /etc/containers/auth.json

  - name: Deploy FDO Server container 
    ansible.builtin.import_role: 
      name: deploy_fdo_server_container
    vars:
      description: "FDO Manufactuing Server"
      container_image: registry.redhat.io/rhel9/fdo-manufacturing-server:latest
      container_name: "manufacturing-server"
      host_port: "{{ manufacturing_server_listen_port_manufacturing_server }}"
      container_port: "{{ manufacturing_server_listen_port_manufacturing_server }}"
      volumes:
      - "{{ fdo_src }}/stores:/etc/fdo/stores:z"
      - "{{ fdo_src }}/keys:/etc/fdo/keys:z"
      - "{{ fdo_src }}/manufacturing-server.conf.d:/etc/fdo/manufacturing-server.conf.d:z"

- name: Deploy manufacturing server rpm
  when:
  - rpm | bool
  ansible.builtin.import_role: 
    name: deploy_fdo_server_rpm
  vars:
    server_name: "fdo-manufacturing-server"
    server_port: "{{ manufacturing_server_listen_port_manufacturing_server }}"

  

    