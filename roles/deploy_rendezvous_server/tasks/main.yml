- name: Install Packages
  ansible.builtin.dnf:
    state: present
    name:
      - firewalld
      - sshpass
      - rsync
      - podman

- name: Start podman service
  ansible.builtin.systemd:
    name: podman
    state: started
    enabled: true

- name: Creates FDO Keys Directory
  ansible.builtin.file:
    path: "{{ fdo_src }}/keys"
    state: directory
    mode: "0775"

- name: Copy Manufacturer Certificate from Manufacturing Server
  ansible.posix.synchronize:
    src: "{{ manufacturing_server_fdo_src }}/keys/manufacturer_cert.pem"
    dest: "{{ fdo_src }}/keys/manufacturer_cert.pem"
    checksum: true
    rsync_timeout: 60
  delegate_to: "{{ manufacturing_server }}"
  when: copy_manufacturer_certs | bool

- name: Create Rendezvous Service Stores
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0775"
    recurse: true
  loop:
    - "{{ fdo_src }}/stores/rendezvous_registered"
    - "{{ fdo_src }}/stores/rendezvous_sessions"
    - "{{ fdo_src }}/rendezvous-server.conf.d"

- name: Create Rendezvous server config file
  ansible.builtin.template:
    src: rendezvous-server.yml.j2
    dest: "{{ fdo_src }}/rendezvous-server.conf.d/rendezvous-server.yml"
    mode: "0644"

- name: Deploy Rendezvous Server as Container
  when:
  - not rpm | bool
  block:
  - name: Setup registry auth
    ansible.builtin.import_role: 
      name: setup_registry_auth
    vars:
      rh_offline_token: "{{ offline_token }}"
      
  - name: Podman login
    containers.podman.podman_login:
      authfile: /etc/containers/auth.json
      registry: registry.redhat.io
  
  - name: Pull container_image
    containers.podman.podman_image:
      name: registry.redhat.io/rhel9/fdo-rendezvous-server:latest
      state: present
      auth_file: /etc/containers/auth.json

  - name: Deploy Rendezvous Server container
    ansible.builtin.import_role:
      name: deploy_fdo_server_container
    vars:
      description: "FDO Rendezvous Server"
      container_image: registry.redhat.io/rhel9/fdo-rendezvous-server:latest
      container_name: "rendezvous-server"
      host_port: "{{ rendezvous_server_listen_port_rendezvous_server }}"
      container_port: "{{ rendezvous_server_listen_port_rendezvous_server }}"
      volumes:
      - "{{ fdo_src }}/stores:/etc/fdo/stores:z"
      - "{{ fdo_src }}/keys:/etc/fdo/keys:z"
      - "{{ fdo_src }}/rendezvous-server.conf.d:/etc/fdo/rendezvous-server.conf.d:z"

- name: Deploy Rendezvous Server as rpm 
  when:
  - rpm | bool
  ansible.builtin.import_role:
    name: deploy_fdo_server_rpm
  vars:
    server_name: "fdo-rendezvous-server"
    server_port: "{{ rendezvous_server_listen_port_rendezvous_server }}"