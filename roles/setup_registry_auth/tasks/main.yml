- name: Authenticate with Red Hat SSO and get access token
  ansible.builtin.uri:
    url: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    headers:
      Content-Type: "application/x-www-form-urlencoded"
    body:
      grant_type: "{{ grant_type }}"
      refresh_token: "{{ rh_offline_token }}"
      client_id: "{{ client_id }}"
  vars:
    grant_type: "refresh_token"
    client_id: "rhsm-api"
  register: token_response

- name: Fail if token retrieval failed
  ansible.builtin.fail:
    msg: "Failed to retrieve access token"
  when: token_response.status != 200

- name: Extract access token from response
  set_fact:
    access_token: "{{ token_response.json.access_token }}"

- name: Download pull secret
  ansible.builtin.uri:
    url: "https://api.openshift.com/api/accounts_mgmt/v1/access_token"
    method: POST
    headers:
      Authorization: "Bearer {{ access_token }}"
  register: pull_secret_response

- name: Fail if pull secret retrieval failed
  ansible.builtin.fail:
    msg: "Failed to retrieve pull secret"
  when: pull_secret_response.status != 200

- name: Save pullsecret to /etc/containers/auth.json
  ansible.builtin.copy:
    content: "{{ pull_secret_response.json }}"
    dest: /etc/containers/auth.json   

- name: Restart podman
  ansible.builtin.service:
    name: podman
    state: restarted
