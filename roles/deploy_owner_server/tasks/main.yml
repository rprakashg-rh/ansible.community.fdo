- name: Install Packages
  ansible.builtin.dnf:
    state: present
    name:
      - firewalld
      - sshpass
      - rsync
      - podman

- name: Start podman service
  ansible.builtin.systemd:
    name: podman
    state: started
    enabled: true

- name: Creates FDO Keys Directory
  ansible.builtin.file:
    path: "{{ fdo_src }}/keys"
    state: directory
    mode: "0775"

- name: Copy Device Certificates from Manufacturing Server
  ansible.posix.synchronize:
    src: "{{ manufacturing_server_fdo_src }}/keys/device_ca_cert.pem"
    dest: "{{ fdo_src }}/keys/device_ca_cert.pem"
    checksum: true
    rsync_timeout: 60
  delegate_to: "{{ manufacturing_server_url }}"
  when: copy_manufacturer_certs | bool

- name: Copy Owner Key from Manufacturing Server
  ansible.posix.synchronize:
    src: "{{ manufacturing_server_fdo_src }}/keys/owner_key.der"
    dest: "{{ fdo_src }}/keys/owner_key.der"
    checksum: true
    rsync_timeout: 60
  delegate_to: "{{ manufacturing_server_url }}"
  when: copy_manufacturer_certs | bool

- name: Copy Owner Certificate from Manufacturing Server
  ansible.posix.synchronize:
    src: "{{ manufacturing_server_fdo_src }}/keys/owner_cert.pem"
    dest: "{{ fdo_src }}/keys/owner_cert.pem"
    checksum: true
    rsync_timeout: 60
  delegate_to: "{{ manufacturing_server_url }}"
  when: copy_manufacturer_certs | bool
  
- name: Create Owner Service Keys Stores
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0775"
    recurse: true
  loop:
    - "{{ fdo_src }}/stores/owner_vouchers"
    - "{{ fdo_src }}/stores/owner_onboarding_sessions"
    - "{{ fdo_src }}/owner-onboarding-server.conf.d"
    - "{{ fdo_src }}/serviceinfo-api-server.conf.d"

- name: Create owner onboarding server config file
  ansible.builtin.template:
    src: owner-onboarding-server.yml.j2
    dest: "{{ fdo_src }}/owner-onboarding-server.conf.d/owner-onboarding-server.yml"
    mode: "0644"

- name: Create serviceinfo api server config file
  ansible.builtin.template:
    src: serviceinfo-api-server.yml.j2
    dest: "{{ fdo_src }}/serviceinfo-api-server.conf.d/serviceinfo-api-server.yml"
    mode: "0644"

- name: Depoly owner server as container
  when:
  - not rpm | bool
  block:
  - name: Setup registry auth
    ansible.builtin.import_role: 
      name: setup_registry_auth
    vars:
      rh_offline_token: "{{ offline_token }}"
      
  - name: Podman login
    containers.podman.podman_login:
      authfile: /etc/containers/auth.json
      registry: registry.redhat.io
  
  - name: Pull owner onboarding server image from registry
    containers.podman.podman_image:
      name: registry.redhat.io/rhel9/fdo-owner-onboarding-server
      state: present
      auth_file: /etc/containers/auth.json

  - name: Pull serviceinfo api server image from registry 
    containers.podman.podman_image:
      name: registry.redhat.io/rhel9/fdo-serviceinfo-api-server
      state: present
      auth_file: /etc/containers/auth.json

  - name: Deploy owner onboarding server 
    ansible.builtin.import_role:
      name: deploy_fdo_server_container
    vars:
      description: "FDO Owner Onboarding Server"
      container_image: registry.redhat.io/rhel9/fdo-owner-onboarding-server
      container_name: "owneronboarding-server"
      host_port: "{{ owner_onboarding_server_listen_port_owner_onboarding_server }}"
      container_port: "{{ owner_onboarding_server_listen_port_owner_onboarding_server }}"
      volumes:
      - "{{ fdo_src }}/stores:/etc/fdo/stores:z"
      - "{{ fdo_src }}/keys:/etc/fdo/keys:z"
      - "{{ fdo_src }}/owner-onboarding-server.conf.d:/etc/fdo/owner-onboarding-server.conf.d:z" 

  - name: Deploy serviceinfo api server
    ansible.builtin.import_role:
      name: deploy_fdo_server_container
    vars:
      description: "FDO ServiceInfo API Server"
      container_image: registry.redhat.io/rhel9/fdo-serviceinfo-api-server
      container_name: "serviceinfo-api-server"
      host_port: "{{ serviceinfo_api_server_listen_port_serviceinfo_api_server }}"
      container_port: "{{ serviceinfo_api_server_listen_port_serviceinfo_api_server }}"
      volumes:
      - "{{ fdo_src }}/stores:/etc/fdo/stores:z"
      - "{{ fdo_src }}/keys:/etc/fdo/keys:z"
      - "{{ fdo_src }}/serviceinfo-api-server.conf.d:/etc/fdo/serviceinfo-api-server.conf.d:z"

- name: Deploy owner server as rpm
  when:
  - rpm | bool
  block:
  - name: Install fdo-owner-onboarding-server 
    ansible.builtin.import_role:
      name: deploy_fdo_server_rpm
    vars:
      server_name: "fdo-owner-onboarding-server" 
      server_port: "{{ owner_onboarding_server_listen_port_owner_onboarding_server }}"
  - name: Enable and start fdo-serviceinfo-api-server
    ansible.builtin.import_role:
      name: deploy_fdo_server_rpm
    vars:
      server_name: "fdo-serviceinfo-api-server" 
      server_port: "{{ serviceinfo_api_server_listen_port_serviceinfo_api_server }}"
